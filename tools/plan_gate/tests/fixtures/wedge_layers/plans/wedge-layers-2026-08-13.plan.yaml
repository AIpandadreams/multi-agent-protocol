constraints:
  - id: WS1
    rule: "sniff-POSITIVE constraint: matches a command carrying a literal sniff token but no action class"
    blocks:
      tool: "Bash|PowerShell"
      arg_pattern: "git status"
    until: close
  - id: WS2
    rule: "sniff-NEGATIVE constraint: matches a command with no sniff token at all - the declared residual"
    blocks:
      tool: "Bash|PowerShell"
      arg_pattern: "cure-probe-alpha"
    until: close
