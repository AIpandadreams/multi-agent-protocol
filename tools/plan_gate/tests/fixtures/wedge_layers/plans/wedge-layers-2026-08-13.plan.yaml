# wedge_layers fixture — C-3 (opus p2r1 F1): does a NON-action-class gating
# layer fail OPEN when the gate wedges before that layer runs?
#
# Two constraints, chosen so the ONLY difference between them is whether the
# command they match carries a literal sniff token:
#
#   WS1  matches "git status"           -> _sniff_gated TRUE   (curable)
#   WS2  matches "cure-probe-alpha"     -> _sniff_gated FALSE  (residual)
#
# Neither command is an action class (measured: classify() returns 0 hits for
# both), so `_state["gated"]` is False for both and the wedge handler's old
# `else` branch called both "non-gated tool call". That is the defect.
#
# The pair is the whole point: a fixture carrying only WS1 would show the cure
# working and hide the fact that it does not close the hole. A fixture carrying
# only WS2 would show the hole and hide the cure. Both ship.
